name = "sentiment-ff75"
main = "worker.js"
compatibility_date = "2024-11-01"
# Keep variables set in the Cloudflare dashboard (HISTORY_PROVENANCE, SERVER_COMPOSITE, ...) across deploys.
# Without this, every `wrangler deploy` from deploy.yml removes them and silently switches collection off.
keep_vars = true

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sentiment-history"
database_id = "f91ca980-b886-423a-bd6f-f3baea46d181"

[triggers]
crons = ["0 6,18 * * *", "*/15 * * * *", "0 * * * *"]
